name: Bug report
description: Something in the native build does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This repository is source only; nothing built is distributed here. Do not attach a ROM or any game file. A save file or a screenshot is fine.

        You build the game yourself; [docs/BUILDING.md](https://github.com/uehlbran/pokeemerald-expansion-native/blob/main/docs/BUILDING.md) says how.

        If the bug also happens in the GBA build of pokeemerald-expansion, it is expansion's own and belongs in [its repository](https://github.com/rh-hideout/pokeemerald-expansion/issues), not here.
  - type: checkboxes
    id: native-only
    attributes:
      label: Reproduced on the native build
      options:
        - label: The bug happens on the native build made from this repository, and I have not attached a ROM or any game file.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Say what you saw and what you thought should happen instead.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Ubuntu 24.04, Windows 11, macOS 15 or Steam Deck.
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      description: For example x86-64 (64-bit) or x86 (32-bit), arm64 on a Mac.
    validations:
      required: true
  - type: input
    id: build-command
    attributes:
      label: The build command you used
      description: For example `make -f Makefile.native -j"$(nproc)" native BITS=64`, or the cross-build command from docs/BUILDING.md.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `pokeemerald-native --version`
      description: The commit the game was built from, ten hex digits (like `0123456789`). Run it in a terminal or command prompt. Started from Explorer, it writes to `pokeemerald.log` in the data directory instead. The commit ends in `-dirty` if the build had uncommitted changes, and is `unknown` for a build made without git.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to do, starting from a new game or a save file you attach, to see the bug.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Linux: the terminal output. Windows: `pokeemerald.log` in the data directory (docs/RUNNING.md says where it is). Steam Deck: the output of `./pokeemerald-native` run in Konsole. Paste it here."
      render: text
    validations:
      required: false
