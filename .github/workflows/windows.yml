# The Windows runner (milestone 8, tasks W8 and W9; docs/PLAN.md "Milestone 8
# plan"; docs/BUILDING.md, "Running it on Windows"). Nothing built for Windows
# runs on the Linux build machine, so Linux jobs cross-build with MinGW-w64
# (docs/BUILDING.md, "Windows (cross-build from Linux)") and one Windows job
# runs what they built:
#
#   cross-build        the game for Windows and the unit tests; patchelf on a
#                      PE file; the Linux 64-bit game and the save it writes
#                      (gate h's first stage, tests/smoke/run_cross_os.sh)
#   cross-build-suite  the Windows test runner build (TEST=1)
#   linux-suite        expansion's suite on the Linux 64-bit build, the
#                      results the Windows ones must equal (gate b)
#   windows            the unit tests, the start-up smoke, the start with no
#                      console (the GUI program's log), the replays (gates
#                      d and e), gate h's second stage on the Linux save, and
#                      the suite through expansion's hydra under MSYS2
#                      (docs/DECISIONS.md, "The suite on Windows runs under
#                      MSYS2")
#   compare            the Windows suite's results against Linux's, test by
#                      test, and gate h's last stage: the Linux build on the
#                      save the Windows build wrote
#
# Artifacts carry the builds and the stages' directories between the jobs.
# The builds hold the complete game, so they are not for keeping
# (docs/DECISIONS.md, "CI artifacts never hold the game beyond a run"): no
# artifact may hold the game or any part of it beyond the run. The builds
# (windows-build, windows-suite-build, linux-build) are kept one day, and the
# last job, `cleanup`, deletes every artifact of the run that is not on its
# explicit list of artifacts without the game (logs, suite results, replay
# dumps and the saves of the replays). The failure-only uploads name their
# files by extension. Once the run has finished its builds are gone, so a
# single failed job cannot be re-run: use "re-run all jobs".
# Windows minutes count double. Nightly at 05:17 UTC, an hour after
# native.yml's nightly tier, and by hand. The time limits keep a whole run
# within 40 minutes: the longest chain is a cross-build (20), the Windows job
# (15) and the comparison (5), or the Linux suite (35) and the comparison;
# measured warm (run 38629824732): 7, 8 and 8.5 minutes for the Linux jobs, 8
# for the Windows job (the suite 5 of them), under a minute for the
# comparison, 17 for the run.
name: windows

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A run by hand replaces an earlier run by hand on the same branch, to save
# the doubled minutes; the nightly is in a group of its own, so a run by hand
# never cancels it and it never cancels one.
concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  # The replays and the suite run headless.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  cross-build:
    name: Cross-build the game and the unit tests; the Linux save
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Windows build starts from the Linux 64-bit data, whose layout
      # checks compile a probe at both widths, so the 32-bit headers are needed
      # here too.
      - name: Prerequisites (docs/BUILDING.md, the native and the Windows lines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib libc6-dev-i386 pkg-config git python3 libpng-dev libsdl2-dev clang ccache gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-tools

      # The same tools cache as native.yml, so the Linux data build does not
      # rebuild them.
      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-native-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'make_tools.mk') }}

      - name: Cache the converted assets
        uses: ./.github/actions/native-assets

      # The game's C reaches the compiler as a file (Makefile.native,
      # COMPILE_C), which ccache can cache: the compiles are most of this job
      # without it. Linked as the MinGW compiler's name, first on PATH, so that
      # ccache finds the real one after it.
      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-game-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-game-${{ runner.os }}-

      - name: Use ccache
        run: |
          mkdir -p ~/.local/ccache-bin
          ln -sf /usr/bin/ccache ~/.local/ccache-bin/x86_64-w64-mingw32-gcc
          echo ~/.local/ccache-bin >> "$GITHUB_PATH"
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          ccache --max-size=2G --zero-stats

      - name: Cache SDL2 for MinGW (pinned in Makefile.native by sha256)
        uses: actions/cache@v4
        with:
          path: build/sdl2-mingw
          key: sdl2-mingw-${{ hashFiles('Makefile.native') }}

      - name: The Linux 64-bit game (gate h's first stage plays it)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: Gate h across operating systems, the first stage (the Linux save)
        run: tests/smoke/run_cross_os.sh save build/native64/pokeemerald-native out/cross-os/save

      - name: Cross-build the game (the Linux data, converted; the PE layout check)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64 TARGET_OS=windows

      - name: Cross-build the unit tests
        run: make -C platform -j"$(nproc)" test TARGET_OS=windows BITS=64

      - name: patchelf on a PE file
        run: make -C platform tools-test TARGET_OS=windows BITS=64

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Upload the Windows build and the Linux save
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: error
          retention-days: 1
          path: |
            build/native64-windows/pokeemerald-native.exe
            build/native64-windows/pokeemerald-native.exe.symbols
            build/native64-windows/SDL2.dll
            platform/build/64-windows/test/*.exe
            platform/build/64-windows/test/*.symbols
            platform/build/64-windows/test/SDL2.dll
            out/cross-os/save/work/from/

      - name: Upload the Linux game (gate h's last stage plays it)
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          if-no-files-found: error
          retention-days: 1
          path: |
            build/native64/pokeemerald-native
            build/native64/pokeemerald-native.symbols

      - name: Keep the outputs of a failed stage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-os-save-outputs
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  cross-build-suite:
    name: Cross-build the test runner (TEST=1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (docs/BUILDING.md, the native and the Windows lines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib libc6-dev-i386 pkg-config git python3 libpng-dev libsdl2-dev clang ccache gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-tools

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-native-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'make_tools.mk') }}

      - name: Cache the converted assets
        uses: ./.github/actions/native-assets

      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-suite-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-suite-${{ runner.os }}-

      - name: Use ccache
        run: |
          mkdir -p ~/.local/ccache-bin
          ln -sf /usr/bin/ccache ~/.local/ccache-bin/x86_64-w64-mingw32-gcc
          echo ~/.local/ccache-bin >> "$GITHUB_PATH"
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          ccache --max-size=2G --zero-stats

      - name: Cache SDL2 for MinGW (pinned in Makefile.native by sha256)
        uses: actions/cache@v4
        with:
          path: build/sdl2-mingw
          key: sdl2-mingw-${{ hashFiles('Makefile.native') }}

      - name: Cross-build the test runner (the Linux TEST=1 data, converted)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64 TARGET_OS=windows TEST=1

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Upload the test runner
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-build
          if-no-files-found: error
          retention-days: 1
          path: |
            build/native64-test-windows/pokeemerald-native-test.exe
            build/native64-test-windows/SDL2.dll

  linux-suite:
    name: The suite on Linux, 64-bit (the results to equal)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (docs/BUILDING.md, the native lines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib libc6-dev-i386 pkg-config git python3 libpng-dev libsdl2-dev ccache

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-native-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'make_tools.mk') }}

      - name: Cache the converted assets
        uses: ./.github/actions/native-assets

      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-windows-linux-suite-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-windows-linux-suite-${{ runner.os }}-

      - name: Use ccache
        run: |
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          ccache --max-size=1G --zero-stats

      - name: Gate b, the suite at 64 bits
        shell: bash -e -o pipefail {0}
        run: make -f Makefile.native -j"$(nproc)" check BITS=64 | tee suite-linux64.log

      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-linux64
          path: suite-linux64.log

  windows:
    name: Run on Windows (unit tests, smoke, no console, replays, save, suite)
    needs: [cross-build, cross-build-suite]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      # The scripts and the replays' expected outputs are committed with LF
      # line endings and compared byte for byte.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download the test runner
        uses: actions/download-artifact@v4
        with:
          name: windows-suite-build
          path: build/native64-test-windows

      # Each executable has 2 minutes (run_windows_tests.sh's TEST_SECONDS; all
      # 70 take 40 seconds), so a hung one costs the job little of its 15
      # minutes: the suite's steps (2 and 10) and the uploads still run.
      - name: The unit tests
        run: platform/test_runner/run_windows_tests.sh platform/build/64-windows/test

      - name: The start-up smoke
        if: always()
        run: platform/test_runner/run_windows_smoke.sh build/native64-windows/pokeemerald-native.exe

      # The game is a GUI program: started with no handles and no console, as
      # Explorer starts it, it writes pokeemerald.log in the data directory
      # (the smoke above checks the PE subsystem, and --version and --keys
      # through a pipe; the replays and the suite below read the game's output
      # through pipes and files).
      - name: No console window (the log of a start with no handles and no console)
        if: always()
        shell: pwsh
        run: platform/test_runner/run_windows_no_console.ps1 build/native64-windows/pokeemerald-native.exe

      - name: Gates d and e, the replays
        if: always()
        run: |
          status=0
          tests/smoke/run.sh build/native64-windows/pokeemerald-native.exe out/open64 || status=1
          tests/smoke/run_debug_menu.sh build/native64-windows/pokeemerald-native.exe out/dbg64 || status=1
          exit $status

      - name: Gate h across operating systems, the second stage (the Windows build on the Linux save)
        if: always()
        run: tests/smoke/run_cross_os.sh load build/native64-windows/pokeemerald-native.exe out/cross-os/save/work/from out/cross-os/load

      # Before the suite too, so that a suite that runs out of time cannot
      # take these with it.
      - name: Keep the logs and the outputs of a failed step so far
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs-before-the-suite
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            platform/build/64-windows/test/*.log
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

      # Expansion's hydra needs fork, poll and stdbuf: MSYS2's, which the
      # image has at C:\msys64, with its gcc (docs/DECISIONS.md, "The suite
      # on Windows runs under MSYS2").
      - name: MSYS2's gcc, and the hydra and patchelf built with it
        if: always()
        shell: C:\msys64\usr\bin\bash.exe -l -e -o pipefail {0}
        env:
          MSYSTEM: MSYS
          CHERE_INVOKING: 1
        run: |
          pacman -S --noconfirm --needed gcc make
          make -C tools/patchelf
          make -C tools/mgba-rom-test-hydra

      # The test runner's own tests first, two of which crash on purpose: a
      # few seconds that show the hydra, the restart on exit code 75 and the
      # protocol work before the whole suite is run.
      - name: The test runner's own tests through the hydra (its crashes included)
        id: suite_check
        if: always()
        timeout-minutes: 2
        shell: C:\msys64\usr\bin\bash.exe -l -e -o pipefail {0}
        env:
          MSYSTEM: MSYS
          CHERE_INVOKING: 1
        run: |
          mkdir -p out
          MAKEFLAGS=-j"$(nproc)" TESTS=test/test_test_runner.c platform/test_runner/run_windows_suite.sh build/native64-test-windows/pokeemerald-native-test.exe | tee out/suite-windows-runner.log

      - name: Gate b, the suite through the hydra
        if: always() && steps.suite_check.outcome == 'success'
        timeout-minutes: 10
        shell: C:\msys64\usr\bin\bash.exe -l -e -o pipefail {0}
        env:
          MSYSTEM: MSYS
          CHERE_INVOKING: 1
        run: |
          MAKEFLAGS=-j"$(nproc)" platform/test_runner/run_windows_suite.sh build/native64-test-windows/pokeemerald-native-test.exe | tee out/suite-windows.log

      - name: Upload the suite's results and gate h's second stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-results
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/suite-windows.log
            out/cross-os/load/work/again/*.txt
            out/cross-os/load/work/again/*.ppm
            out/cross-os/load/work/again/*.sav
            out/cross-os/load/work/again/*.rtc
            out/cross-os/load/work/again/*.log
          if-no-files-found: ignore

      - name: Keep the logs and the outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            platform/build/64-windows/test/*.log
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  compare:
    name: Compare the suites; gate h's last stage on Linux
    needs: [cross-build, linux-suite, windows]
    if: always() && needs.cross-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (the Linux game's libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0

      - name: Download the Linux game
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: build/native64

      - name: Download the Linux save
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-build

      - name: Download the Windows results
        uses: actions/download-artifact@v4
        with:
          name: windows-results
          path: out

      - name: Download the Linux results
        uses: actions/download-artifact@v4
        with:
          name: suite-linux64

      - name: Gate b on Windows, test by test against Linux 64-bit
        run: platform/test_runner/compare_suite_results.sh suite-linux64.log out/suite-windows.log

      - name: Gate h across operating systems, the last stage (the Linux build on the Windows save)
        if: always()
        run: |
          chmod +x build/native64/pokeemerald-native
          tests/smoke/run_cross_os.sh back build/native64/pokeemerald-native windows-build/out/cross-os/save/work/from out/cross-os/load/work/again out/cross-os/back

      - name: Keep the outputs of a failed stage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compare-outputs
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  # The last job: after every job that uses an artifact, deletes this run's
  # artifacts except the ones on the list, which hold no game. A new artifact
  # that is not on the list is deleted, so the game cannot be kept by
  # forgetting; the job fails if one cannot be deleted. The Actions API is
  # the only way to delete before the retention ends.
  cleanup:
    name: Delete the builds from the run
    needs: [cross-build, cross-build-suite, linux-suite, windows, compare]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/delete-run-artifacts
        with:
          # Without the game: logs, the suites' results, the replays' dumps,
          # screenshots and saves.
          keep: |
            suite-linux64
            windows-results
            windows-logs-before-the-suite
            windows-logs
            cross-os-save-outputs
            compare-outputs
