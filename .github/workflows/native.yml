# The native build's gate, as docs/STATUS.md records it, on a Linux runner:
# the platform gate, the native executables at both widths plain and
# sanitized, both replays on each, expansion's suite at both widths plain
# and sanitized, the cross-width save gate, and the GBA ROM with its sha1
# (docs/PLAN.md "Milestone 8 plan"; docs/DECISIONS.md says why this runs on
# pushes to main and by hand only). Upstream's build.yml is not this file's
# concern: it triggers on branches this repository does not have.
name: native

on:
  push:
    branches:
      - main
      - 'ci/**'
  workflow_dispatch:

env:
  # The GBA ROM this repository's main must produce (docs/STATUS.md, gate c).
  ROM_SHA1: e2d4600d4e7b1269ac50c28bc96ece2b758ded9e
  # The replays and the suite run headless; the sanitized runs list every
  # finding rather than stop at the first (tests/smoke/lib.sh).
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  gba:
    name: GBA ROM (gate c)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (docs/BUILDING.md, the GBA line)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-gba-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build the ROM
        run: make -j"$(nproc)"

      - name: The ROM is byte-identical to the recorded one
        run: |
          sha1sum pokeemerald.gba
          echo "$ROM_SHA1  pokeemerald.gba" | sha1sum -c -

  native:
    name: Native gate (platform, a, b, d, e, f, h at both widths)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # docs/BUILDING.md installs libsdl2-dev:i386 for the 32-bit build. On the
      # runner image that package cannot be installed: it pulls in
      # libglib2.0-dev:i386, whose -dev-bin part cannot coexist with the
      # image's amd64 one. The 32-bit link needs only the i386 runtime library
      # and a libSDL2.so link to it (the headers are the amd64 package's, the
      # same files; pkg-config's -lSDL2 then resolves in /usr/lib/i386-linux-gnu).
      - name: Prerequisites (docs/BUILDING.md, the native lines; the i386 SDL2 as the comment says)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib clang clang-format clang-tidy cppcheck cmake ninja-build pkg-config git python3 libpng-dev
          sudo apt-get install -y --no-install-recommends libsdl2-dev libsdl2-2.0-0:i386 libc6-dev-i386
          sudo ln -s libSDL2-2.0.so.0 /usr/lib/i386-linux-gnu/libSDL2.so
          gcc --version | head -1; clang-format --version; clang-tidy --version | head -1; cppcheck --version
          pkg-config --cflags --libs sdl2; ls -l /usr/lib/i386-linux-gnu/libSDL2.so

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-native-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'make_tools.mk') }}

      - name: The platform gate (format, lint, the sanitized unit tests at both widths, tools-test, glue-test)
        run: make -C platform gate

      - name: Native build, 32-bit
        run: make -f Makefile.native -j"$(nproc)" native BITS=32

      - name: Gates d and e, 32-bit
        run: |
          tests/smoke/run.sh build/native32/pokeemerald-native out/open32
          tests/smoke/run_debug_menu.sh build/native32/pokeemerald-native out/dbg32

      - name: Native build, 64-bit (with the three link-time data checks)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: Gates d and e, 64-bit
        run: |
          tests/smoke/run.sh build/native64/pokeemerald-native out/open64
          tests/smoke/run_debug_menu.sh build/native64/pokeemerald-native out/dbg64

      - name: Gate h, the cross-width save, both ways
        run: |
          tests/smoke/run_cross_width.sh build/native32/pokeemerald-native build/native64/pokeemerald-native out/x3264
          tests/smoke/run_cross_width.sh build/native64/pokeemerald-native build/native32/pokeemerald-native out/x6432

      - name: Native build, 32-bit sanitized
        run: make -f Makefile.native -j"$(nproc)" native BITS=32 SANITIZE=1

      - name: Native build, 64-bit sanitized
        run: make -f Makefile.native -j"$(nproc)" native BITS=64 SANITIZE=1

      - name: Gates d, e and h sanitized, both widths
        env:
          ASAN_OPTIONS: halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          tests/smoke/run.sh build/native32-san/pokeemerald-native out/open32s
          tests/smoke/run_debug_menu.sh build/native32-san/pokeemerald-native out/dbg32s
          tests/smoke/run.sh build/native64-san/pokeemerald-native out/open64s
          tests/smoke/run_debug_menu.sh build/native64-san/pokeemerald-native out/dbg64s
          tests/smoke/run_cross_width.sh build/native32-san/pokeemerald-native build/native64-san/pokeemerald-native out/x3264s
          tests/smoke/run_cross_width.sh build/native64-san/pokeemerald-native build/native32-san/pokeemerald-native out/x6432s

      - name: Gate b, the suite at 32 bits
        run: make -f Makefile.native -j"$(nproc)" check BITS=32

      - name: Gate b, the suite at 64 bits
        run: make -f Makefile.native -j"$(nproc)" check BITS=64

      - name: Gate b sanitized, 32 bits
        run: make -f Makefile.native -j"$(nproc)" check BITS=32 SANITIZE=1

      - name: Gate b sanitized, 64 bits
        run: make -f Makefile.native -j"$(nproc)" check BITS=64 SANITIZE=1

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs
          path: out/
          if-no-files-found: ignore
