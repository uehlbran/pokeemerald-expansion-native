# NO WORKFLOW UPLOADS THE GAME, EVER (docs/DECISIONS.md, "No workflow uploads
# the game"): no artifact, at any retention, holds the game, the test runner,
# an archive of either, or a save, data file or output directory with
# expansion's assets or a binary in it; a public repository's artifacts are
# downloadable by any logged-in GitHub user. This file uploads, from a failed
# job only, the gates' outputs: text and logs, frame images (.ppm, .png) and
# the save and clock files (.sav, .rtc) of the save gates, by an explicit list
# of file patterns, one per line (a frame image and a save are not a playable
# build). platform/build_glue/check_workflow_uploads.py fails the gate
# (the per-push job below runs it) if an upload could match anything else.
# Caches hold compiled objects, converted assets and ccache data, never a
# linked game (same entry).
#
# The native build's gate on a Linux runner, in two tiers (docs/DECISIONS.md,
# "CI runs in two tiers"; the local pre-merge gate stays the full check at
# both widths, and CI is the backstop that proves a clean clone builds and
# passes on a documented image). One file, because the tiers share their
# environment and setup; the `if:` on each job picks the tier.
#
# Per-push tier (`push` to main and ci/**; docs-only pushes are ignored; a
# newer push to a ref cancels the older run): job `push`: the 64-bit native
# build, the platform gate (which also builds and tests the 32-bit platform
# library, so the i386 SDL2 workaround below stays) and both 64-bit replays;
# the suite is not here (10 minutes warm against a 15-minute target; the
# local pre-merge gate runs it, and `native64` below runs it nightly).
# The setup every native job shares is the composite action
# .github/actions/native-setup. ccache, the tools and the converted assets are
# cached between runs:
# the game's C reaches gcc as a file (Makefile.native, COMPILE_C), the one
# form ccache can cache, and with no -g the cache hits across commits and
# checkout paths; the converted graphics are keyed on all of their inputs
# (.github/actions/native-assets says which), since the full conversion is
# repeated on every run without the cache.
#
# Nightly tier (`schedule`, plus `workflow_dispatch`): parallel jobs `gba`
# (the ROM and its sha1), `native64` (the plain 64-bit build and suite),
# `native32` (32-bit build, both replays, the suite),
# `native32-san` and `native64-san` (the sanitized build, both replays and
# the suite), `cross-width` (gate h, the save made at one width loaded at the
# other, plain and sanitized, both ways).
#
# Upstream's build.yml, docs.yml and labels.yml are not this file's concern:
# they are filtered to master and upcoming, which this repository does not have
# (UPSTREAM_MODIFICATIONS.md).
name: native

on:
  push:
    branches:
      - main
      - 'ci/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The GBA ROM this repository's main must produce (docs/STATUS.md, gate c).
  ROM_SHA1: e2d4600d4e7b1269ac50c28bc96ece2b758ded9e
  # The replays and the suite run headless.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  push:
    name: Per-push gate (64-bit build, platform gate, replays)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: push
          i386: true
          lint-tools: true

      - name: Native build, 64-bit (with the three link-time data checks)
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: The platform gate (format, lint, the sanitized unit tests at both widths, tools-test, glue-test)
        run: |
          make -C platform gate

      - name: No upload can hold the game (docs/DECISIONS.md, "No workflow uploads the game")
        run: python3 -I platform/build_glue/check_workflow_uploads.py

      - name: Gates d and e, 64-bit
        run: |
          tests/smoke/run.sh build/native64/pokeemerald-native out/open64
          tests/smoke/run_debug_menu.sh build/native64/pokeemerald-native out/dbg64


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-push
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  gba:
    name: GBA ROM (gate c)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (docs/BUILDING.md, the GBA line)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-gba-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build the ROM
        run: make -j"$(nproc)"

      - name: The ROM is byte-identical to the recorded one
        run: |
          sha1sum pokeemerald.gba
          echo "$ROM_SHA1  pokeemerald.gba" | sha1sum -c -

      - name: The GBA suite builds and equals the baseline (docs/research/gba-baseline-1.17.1.md)
        run: |
          set -o pipefail
          make -j"$(nproc)" check 2>&1 | tee gba-check.log
          sed 's/\x1b\[[0-9;]*m//g' gba-check.log | grep '^- Tests' | tr -s ' ' > gba-totals.txt
          cat > gba-expected.txt <<'EOF'
          - Tests KNOWN_FAILING: 18
          - Tests TO_DO: 421
          - Tests EXPECT_FAILING: 9
          - Tests PASSED: 5414
          - Tests TOTAL: 5862
          EOF
          sed -i 's/^ *//' gba-expected.txt
          diff gba-expected.txt gba-totals.txt

  native32:
    name: Nightly, 32-bit build, replays, suite
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: native32
          i386: true

      - name: Native build, 32-bit
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=32

      - name: Gates d and e, 32-bit
        run: |
          tests/smoke/run.sh build/native32/pokeemerald-native out/open32
          tests/smoke/run_debug_menu.sh build/native32/pokeemerald-native out/dbg32

      - name: Gate b, the suite at 32 bits
        run: |
          make -f Makefile.native -j"$(nproc)" check BITS=32


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-native32
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  native64:
    name: Nightly, 64-bit build and suite
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: native64

      - name: Native build, 64-bit (with the three link-time data checks)
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: Gate b, the suite at 64 bits
        run: |
          make -f Makefile.native -j"$(nproc)" check BITS=64


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-native64
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore


  native32-san:
    name: Nightly, 32-bit sanitized build, replays, suite
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: native32-san
          i386: true

      - name: Native build, 32-bit sanitized
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=32 SANITIZE=1

      - name: Gates d and e sanitized, 32-bit
        env:
          ASAN_OPTIONS: halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          tests/smoke/run.sh build/native32-san/pokeemerald-native out/open32s
          tests/smoke/run_debug_menu.sh build/native32-san/pokeemerald-native out/dbg32s

      - name: Gate b sanitized, 32 bits
        run: |
          make -f Makefile.native -j"$(nproc)" check BITS=32 SANITIZE=1


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-native32-san
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  native64-san:
    name: Nightly, 64-bit sanitized build, replays, suite
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: native64-san

      - name: Native build, 64-bit sanitized
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=64 SANITIZE=1

      - name: Gates d and e sanitized, 64-bit
        env:
          ASAN_OPTIONS: halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          tests/smoke/run.sh build/native64-san/pokeemerald-native out/open64s
          tests/smoke/run_debug_menu.sh build/native64-san/pokeemerald-native out/dbg64s

      - name: Gate b sanitized, 64 bits
        run: |
          make -f Makefile.native -j"$(nproc)" check BITS=64 SANITIZE=1


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-native64-san
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore

  cross-width:
    name: Nightly, cross-width save (gate h), plain and sanitized
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: cross-width
          i386: true

      - name: Native builds, both widths
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=32
          make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: Gate h, the cross-width save, both ways
        run: |
          tests/smoke/run_cross_width.sh build/native32/pokeemerald-native build/native64/pokeemerald-native out/x3264
          tests/smoke/run_cross_width.sh build/native64/pokeemerald-native build/native32/pokeemerald-native out/x6432

      - name: Native builds, both widths, sanitized
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=32 SANITIZE=1
          make -f Makefile.native -j"$(nproc)" native BITS=64 SANITIZE=1

      - name: Gate h sanitized, both ways
        env:
          ASAN_OPTIONS: halt_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          tests/smoke/run_cross_width.sh build/native32-san/pokeemerald-native build/native64-san/pokeemerald-native out/x3264s
          tests/smoke/run_cross_width.sh build/native64-san/pokeemerald-native build/native32-san/pokeemerald-native out/x6432s


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-cross-width
          # No braces in these patterns: @actions/glob sets nobrace, so {a,b} matches nothing.
          path: |
            out/**/*.txt
            out/**/*.log
            out/**/*.ppm
            out/**/*.png
            out/**/*.sav
            out/**/*.rtc
            out/**/*.diff
            out/**/*.replay
            out/**/*.all
            out/**/*.known-patterns
          if-no-files-found: ignore
