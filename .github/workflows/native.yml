# The native build's gate on a Linux runner, in two tiers (docs/DECISIONS.md,
# "CI runs in two tiers"; the local pre-merge gate stays the full check at
# both widths, and CI is the backstop that proves a clean clone builds and
# passes on a documented image). One file, because the tiers share their
# environment and setup; the `if:` on each job picks the tier.
#
# Per-push tier (`push` to main and ci/**; docs-only pushes are ignored; a
# newer push to a ref cancels the older run): job `push`: the 64-bit native
# build, the platform gate (which also builds and tests the 32-bit platform
# library, so the i386 SDL2 workaround below stays), both 64-bit replays,
# and the plain 64-bit suite. ccache and the tools are cached between runs.
#
# Nightly tier (`schedule`, plus `workflow_dispatch`): parallel jobs `gba`
# (the ROM and its sha1), `native32` (32-bit build, both replays, the suite),
# `native32-san` and `native64-san` (the sanitized build, both replays and
# the suite), `cross-width` (gate h, the save made at one width loaded at the
# other, plain and sanitized, both ways).
#
# Upstream's build.yml is not this file's concern: it triggers on branches
# this repository does not have.
name: native

on:
  push:
    branches:
      - main
      - 'ci/**'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: native-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The GBA ROM this repository's main must produce (docs/STATUS.md, gate c).
  ROM_SHA1: e2d4600d4e7b1269ac50c28bc96ece2b758ded9e
  # The replays and the suite run headless.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy

jobs:
  push:
    name: Per-push gate (64-bit build, platform gate, replays, suite)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # docs/BUILDING.md installs libsdl2-dev:i386 for the 32-bit build. On the
      # runner image apt cannot install it: it pulls in libglib2.0-dev:i386,
      # whose -dev-bin part cannot coexist with the image's amd64 one. The
      # 32-bit build needs only the i386 runtime library and, from the -dev
      # package, the i386 configuration header (SIZEOF_VOIDP 4) and the
      # libSDL2.so links; those two are taken from the downloaded package
      # without its dependencies.
      - name: Prerequisites (docs/BUILDING.md, the native lines; the i386 SDL2 as the comment above says)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-multilib g++-multilib libc6-dev-i386 pkg-config git python3 libpng-dev libsdl2-dev ccache clang clang-format clang-tidy cppcheck cmake ninja-build
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0:i386
          mkdir -p /tmp/sdl2-i386 && cd /tmp/sdl2-i386 && apt-get download libsdl2-dev:i386 && dpkg-deb -x libsdl2-dev_*_i386.deb unpacked
          sudo cp -a unpacked/usr/include/i386-linux-gnu /usr/include/
          sudo cp -a unpacked/usr/lib/i386-linux-gnu/libSDL2.so unpacked/usr/lib/i386-linux-gnu/libSDL2-2.0.so /usr/lib/i386-linux-gnu/
          cd "$GITHUB_WORKSPACE"
          pkg-config --cflags --libs sdl2; ls -l /usr/lib/i386-linux-gnu/libSDL2.so /usr/include/i386-linux-gnu/SDL2/_real_SDL_config.h

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-native-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h', 'make_tools.mk') }}

      # Put ccache's compiler links first on PATH so gcc and g++ go through it.
      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-push-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-push-${{ runner.os }}-

      - name: Use ccache
        run: |
          echo /usr/lib/ccache >> "$GITHUB_PATH"
          ccache --max-size=1G --zero-stats

      - name: Native build, 64-bit (with the three link-time data checks)
        run: |
          make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: The platform gate (format, lint, the sanitized unit tests at both widths, tools-test, glue-test)
        run: |
          make -C platform gate

      - name: Gates d and e, 64-bit
        run: |
          tests/smoke/run.sh build/native64/pokeemerald-native out/open64
          tests/smoke/run_debug_menu.sh build/native64/pokeemerald-native out/dbg64

      - name: Gate b, the suite at 64 bits
        run: |
          make -f Makefile.native -j"$(nproc)" check BITS=64


      - name: ccache statistics
        if: always()
        run: ccache -s

      - name: Keep the replay outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: replay-outputs-push
          path: out/
          if-no-files-found: ignore

  gba:
    name: GBA ROM (gate c)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Prerequisites (docs/BUILDING.md, the GBA line)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache the build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-gba-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Build the ROM
        run: make -j"$(nproc)"

      - name: The ROM is byte-identical to the recorded one
        run: |
          sha1sum pokeemerald.gba
          echo "$ROM_SHA1  pokeemerald.gba" | sha1sum -c -

