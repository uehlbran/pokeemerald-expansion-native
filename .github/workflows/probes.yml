# NO WORKFLOW UPLOADS THE GAME, EVER (docs/DECISIONS.md, "No workflow uploads
# the game"): this file uploads the probes' text reports only (out/*.txt); the
# probe executables stay on the runner, and none holds the game.
# platform/build_glue/check_workflow_uploads.py checks the pattern.
#
# Milestone 8 loader probes (research/probes/README.md). Manual trigger only:
#   gh workflow run probes.yml --ref work/m8-probes
name: probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-layout:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Probe W1 (layout B on Windows)
        run: bash research/probes/windows_layout/build.sh
      - name: Print the report
        if: always()
        run: cat research/probes/windows_layout/out/report.txt
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-windows-layout
          path: research/probes/windows_layout/out/*.txt

  macos-layout:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe M0 (fixed-address image on macOS x86_64)
        run: bash research/probes/macos_layout/build.sh
      - name: Print the report
        if: always()
        run: cat research/probes/macos_layout/out/report.txt
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-macos-layout
          path: research/probes/macos_layout/out/*.txt

  macos-arm64-layout:
    runs-on: macos-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Probe M0 on arm64 (expected to be refused)
        run: bash research/probes/macos_layout/build.sh
      - name: Print the report
        if: always()
        run: cat research/probes/macos_layout/out/report.txt
      - name: Upload the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-macos-arm64-layout
          path: research/probes/macos_layout/out/*.txt
