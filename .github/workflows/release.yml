# The release pipeline: the Linux 64-bit tarball, the Windows 64-bit zip and
# the macOS x86_64 tarball, their SHA-256 sums and build-provenance
# attestations. By hand only.
#
# THE RULE: no public release and no tag without an explicit decision to
# publish. A built executable contains the complete game's assets, so a
# public release is legally the same as distributing a ROM, which this project
# does not do (docs/DECISIONS.md, "Why no public release"). The default is
# therefore `publish: false`: each archive is built and checked in its own job
# (its contents listed and compared with what it must hold, the Linux and the
# macOS executables started headless, the SHA-256 printed in the log), and
# NOTHING is uploaded or created. `publish: true` with a `tag` uploads the
# archives for the jobs after it and creates a GitHub release at the built
# commit; it is set only on that decision.
#
# NO WORKFLOW UPLOADS THE GAME, EVER (docs/DECISIONS.md, "No workflow uploads
# the game"), and this file is the one place where the rule has an exception,
# because a release is the publication: a run WITHOUT `publish` uploads
# nothing at all (no artifact, no release). With `publish` the archives go as
# artifacts, for one day, to the jobs that make the release, and the last job
# deletes them. platform/build_glue/check_workflow_uploads.py fails the gate
# if an archive upload here is not conditioned on `publish`, and for any
# other upload that could match more than text. Without `publish` no job
# needs the cleanup, so it runs only with it. A finished publish run cannot
# re-run a single failed job (its archives are deleted): use "re-run all
# jobs".
#
#   check-inputs   the tag, validated before anything else runs
#   linux          the 64-bit build, the tarball, its check
#   windows        the MinGW-w64 cross-build (as windows.yml), the zip, its check
#   macos          the macOS build (as macos.yml, on macos-15-intel only), the
#                  tarball (unsigned, SDL's dylibs bundled), its check
#   checksums      only with `publish`: SHA256SUMS.txt and the attestations
#   publish        only with `publish`: the GitHub release
#   cleanup        only with `publish`, last: deletes the run's artifacts
#
# Verify a download with `gh attestation verify <file> --repo <owner>/<repo>`
# and `sha256sum --check SHA256SUMS.txt`.
#
# NOTE: actions/attest-build-provenance works in a private repository only on
# GitHub Enterprise Cloud (its README); on a user-owned private repository the
# step fails with "Feature not available for user-owned private repositories"
# (run 38660260570, 2026-10-15). It runs on the publish path only, which is
# taken once the repository is public, where it works unchanged.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub release (needs an explicit decision to publish)'
        type: boolean
        default: false
      tag:
        description: 'Release tag, vX.Y.Z (required with publish)'
        type: string
        default: ''

permissions:
  contents: read

# Never cancelled: a run that publishes must finish. The event name is in the
# group as in windows.yml.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-inputs:
    name: Validate the inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: The tag, when publishing
        env:
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "release: publishing needs a tag like v1.2.3 (or v1.2.3-rc.1); got '$TAG'" >&2
              exit 1
            fi
          fi

  linux:
    name: Linux 64-bit tarball
    needs: check-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: release-linux

      - name: Build (docs/BUILDING.md; tools/build-native.sh runs the same make)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64

      - name: Package
        run: |
          set -euo pipefail
          name="pokeemerald-native-${GITHUB_SHA::10}-linux-x86_64"
          mkdir -p "dist/$name"
          cp build/native64/pokeemerald-native .github/release/pokeemerald-native.sh LICENSE docs/RUNNING.md .github/release/README.txt "dist/$name/"
          # The SDL2 the executable was linked against, under its soname,
          # for the launcher to put first (the Steam Deck package).
          sdl=$(ldd build/native64/pokeemerald-native | awk '$1 == "libSDL2-2.0.so.0" { print $3 }')
          test -n "$sdl"
          cp --dereference "$sdl" "dist/$name/libSDL2-2.0.so.0"
          cp /usr/share/doc/libsdl2-2.0-0/copyright "dist/$name/SDL2-LICENSE.txt"
          tar --owner=0 --group=0 --numeric-owner -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          ls -l dist

      - name: Check the tarball (contents, headless start) and print its SHA-256
        run: |
          set -euo pipefail
          archive=$(ls dist/*.tar.gz)
          [ "$(printf '%s\n' "$archive" | wc -l)" -eq 1 ]
          base=$(basename "$archive" .tar.gz)
          tar -tzf "$archive" | sort | tee "$RUNNER_TEMP/listing.txt"
          for file in pokeemerald-native pokeemerald-native.sh LICENSE RUNNING.md README.txt libSDL2-2.0.so.0 SDL2-LICENSE.txt; do
            grep -qx "$base/$file" "$RUNNER_TEMP/listing.txt" || { echo "release: $file is missing from $archive" >&2; exit 1; }
          done
          [ "$(grep -vc '/$' "$RUNNER_TEMP/listing.txt")" -eq 7 ] || { echo "release: $archive holds more than the seven files it should" >&2; exit 1; }
          # Started from the unpacked archive as a player would (the launcher
          # puts the bundled SDL2 first), headless, with its save and clock
          # in a scratch directory.
          scratch=$(mktemp -d)
          tar -xzf "$archive" -C "$scratch"
          mkdir "$scratch/home"
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/home/.local/share" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          "$scratch/$base/pokeemerald-native.sh" --version
          "$scratch/$base/pokeemerald-native.sh" --headless --silent --unthrottled --frames 60 \
            --save "$scratch/check.sav" --rtc-offset "$scratch/check.rtc"
          rm -rf "$scratch"
          sha256sum -- "$archive"

      - name: ccache statistics
        if: always()
        run: ccache -s

      # Only with `publish`: the next jobs build the release from it.
      - name: Upload the tarball
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows 64-bit zip (cross-built)
    needs: check-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/native-setup
        with:
          ccache-name: release-windows

      - uses: ./.github/actions/windows-cross-setup

      - name: Cross-build the game (the Linux data, converted; the PE layout check)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64 TARGET_OS=windows

      - name: Package
        run: |
          set -euo pipefail
          name="pokeemerald-native-${GITHUB_SHA::10}-windows-x86_64"
          mkdir -p "dist/$name"
          cp build/native64-windows/pokeemerald-native.exe build/native64-windows/SDL2.dll LICENSE docs/RUNNING.md .github/release/README.txt "dist/$name/"
          cp build/sdl2-mingw/LICENSE.txt "dist/$name/SDL2-LICENSE.txt"
          (cd dist && zip -q -X -r "$name.zip" "$name")
          rm -r "dist/$name"
          ls -l dist

      - name: Check the zip (contents, a PE executable) and print its SHA-256
        run: |
          set -euo pipefail
          archive=$(ls dist/*.zip)
          [ "$(printf '%s\n' "$archive" | wc -l)" -eq 1 ]
          base=$(basename "$archive" .zip)
          unzip -Z1 "$archive" | sort | tee "$RUNNER_TEMP/listing.txt"
          for file in pokeemerald-native.exe SDL2.dll LICENSE RUNNING.md README.txt SDL2-LICENSE.txt; do
            grep -qx "$base/$file" "$RUNNER_TEMP/listing.txt" || { echo "release: $file is missing from $archive" >&2; exit 1; }
          done
          [ "$(grep -vc '/$' "$RUNNER_TEMP/listing.txt")" -eq 6 ] || { echo "release: $archive holds more than the six files it should" >&2; exit 1; }
          # A Windows executable cannot start on this runner (windows.yml
          # starts the same build on Windows): its format is checked instead.
          scratch=$(mktemp -d)
          unzip -q "$archive" "$base/pokeemerald-native.exe" -d "$scratch"
          x86_64-w64-mingw32-objdump -f "$scratch/$base/pokeemerald-native.exe" | tee "$scratch/pe.txt"
          grep -q 'file format pei-x86-64' "$scratch/pe.txt"
          rm -rf "$scratch"
          sha256sum -- "$archive"

      - name: ccache statistics
        if: always()
        run: ccache -s

      # Only with `publish`: the next jobs build the release from it.
      - name: Upload the zip
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS x86_64 tarball (unsigned)
    needs: check-inputs
    runs-on: macos-15-intel
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/macos-setup
        with:
          ccache-name: release-macos

      - name: Build (docs/BUILDING.md, "macOS"; tools/build-native.sh --os macos runs the same make)
        run: make -f Makefile.native -j"$(nproc)" native BITS=64

      # A tarball, not a zip, like the Linux archive: tar keeps the
      # executable bit, and Archive Utility opens it with a double click. The
      # file is not signed with an identity and not notarized (no Apple
      # Developer account); RUNNING.md tells the player how to open it past
      # Gatekeeper. bundle-macos.sh copies the SDL libraries in, rewrites
      # their install names to @executable_path and signs them ad hoc (the
      # rewrite breaks any signature they had), and fails if anything still
      # names a Homebrew path.
      - name: Package
        run: |
          set -euo pipefail
          name="pokeemerald-native-${GITHUB_SHA::10}-macos-x86_64"
          mkdir -p "dist/$name"
          cp build/native64/pokeemerald-native LICENSE docs/RUNNING.md .github/release/README.txt "dist/$name/"
          .github/release/bundle-macos.sh "dist/$name/pokeemerald-native" "dist/$name"
          file "dist/$name/pokeemerald-native"
          ls -l "dist/$name"
          # --no-mac-metadata: no AppleDouble files or extended attributes
          # (the build machine's, not the player's) in the archive.
          tar --uid 0 --gid 0 --numeric-owner --no-mac-metadata -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          ls -l dist

      # The archive's listing against what it must hold, then the archive as
      # a player gets it, started from an empty folder with
      # DYLD_PRINT_LIBRARIES: every library the process loads, SDL3 (opened
      # by sdl2-compat with dlopen) included, must come from the system or
      # from the folder, none from Homebrew. SDL's dummy drivers run it with
      # no screen. bundle-macos.sh follows the libraries' own dependencies,
      # so the number of files is not fixed: every file must be one of the
      # four, a library with its licence, or a licence with its library.
      - name: Check the tarball (contents, a headless start loading nothing from Homebrew) and print its SHA-256
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -euo pipefail
          archive=$(ls dist/*.tar.gz)
          [ "$(printf '%s\n' "$archive" | wc -l)" -eq 1 ]
          base=$(basename "$archive" .tar.gz)
          tar -tzf "$archive" | sort | tee "$RUNNER_TEMP/listing.txt"
          for file in pokeemerald-native LICENSE RUNNING.md README.txt libSDL2-2.0.0.dylib libSDL3.dylib libSDL2-2.0.0-LICENSE.txt libSDL3-LICENSE.txt; do
            grep -qx "$base/$file" "$RUNNER_TEMP/listing.txt" || { echo "release: $file is missing from $archive" >&2; exit 1; }
          done
          grep -v '/$' "$RUNNER_TEMP/listing.txt" | while read -r path; do
            file=${path#"$base"/}
            case "$file" in
              pokeemerald-native|LICENSE|RUNNING.md|README.txt) ;;
              */*) echo "release: $path is not at the top of $archive" >&2; exit 1 ;;
              *.dylib) grep -qx "$base/${file%.dylib}-LICENSE.txt" "$RUNNER_TEMP/listing.txt" || { echo "release: $file has no licence in $archive" >&2; exit 1; } ;;
              *-LICENSE.txt) grep -qx "$base/${file%-LICENSE.txt}.dylib" "$RUNNER_TEMP/listing.txt" || { echo "release: $file is the licence of no library in $archive" >&2; exit 1; } ;;
              *) echo "release: $archive holds $file, which it should not" >&2; exit 1 ;;
            esac
          done
          check="$RUNNER_TEMP/archive-check"
          mkdir "$check"
          tar -C "$check" -xzf "$archive"
          here="$check/$base"
          (cd "$here" && DYLD_PRINT_LIBRARIES=1 ./pokeemerald-native --headless --silent --unthrottled --frames 60 --data-dir "$RUNNER_TEMP/archive-data") 2> "$RUNNER_TEMP/dyld.txt"
          grep -i 'libSDL' "$RUNNER_TEMP/dyld.txt"
          grep -q "$here/libSDL2-2.0.0.dylib" "$RUNNER_TEMP/dyld.txt"
          grep -q "$here/libSDL3.dylib" "$RUNNER_TEMP/dyld.txt"
          if grep -e '/usr/local/' -e '/opt/homebrew/' "$RUNNER_TEMP/dyld.txt"; then
            echo "release: the archive's executable loaded a library from Homebrew" >&2
            exit 1
          fi
          rm -rf "$check" "$RUNNER_TEMP/archive-data"
          sha256sum -- "$archive"

      - name: ccache statistics
        if: always()
        run: ccache -s

      # Only with `publish`: the next jobs build the release from it.
      - name: Upload the tarball
        if: inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: macos-archive
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  checksums:
    name: Checksums and attestations (publish only)
    if: inputs.publish
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-archive
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-archive
          path: dist

      - name: SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip | tee SHA256SUMS.txt

      # One day, deleted by `cleanup`; the release job below downloads it.
      - name: Upload the archives and the sums
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

      # The publish path only (the job is skipped without `publish`).
      - name: Attest the archives (private repository note at the top)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish the GitHub release
    if: inputs.publish
    needs: [check-inputs, checksums]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Built from commit $GITHUB_SHA by the release workflow, run $GITHUB_RUN_ID.

          Files: the Linux x86-64 tarball, the Windows x86-64 zip, the macOS x86_64 tarball, and SHA256SUMS.txt.

          Verify a download:

              sha256sum --check SHA256SUMS.txt
              gh attestation verify <file> --repo $GH_REPO

          Requirements: Linux needs SDL2 2.0 installed (libsdl2-2.0-0), not bundled.
          Windows needs Windows 10 version 1903 or later, 64-bit; the executable is
          not signed, so SmartScreen warns: More info, then Run anyway.
          macOS needs an Intel Mac or an Apple-silicon Mac with Rosetta 2; the
          executable is not signed or notarized, so Gatekeeper blocks it until
          you allow it (RUNNING.md, "macOS"). SDL is bundled.
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt

  # The last job, with `publish` only (without it nothing was uploaded):
  # deletes every artifact of this run, whether or not the release was made
  # (the release holds the files; the run keeps none). It fails if one cannot
  # be deleted or one is left.
  cleanup:
    name: Delete the archives from the run
    if: ${{ always() && inputs.publish }}
    needs: [check-inputs, linux, windows, macos, checksums, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/delete-run-artifacts
        with:
          keep: ''
